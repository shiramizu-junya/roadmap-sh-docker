services:
    db:
        image: mysql:8.4
        ports:
            - "127.0.0.1:3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root-pass
            MYSQL_DATABASE: ec
            MYSQL_USER: ec
            MYSQL_PASSWORD: ec-pass
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
            interval: 2s
            timeout: 5s
            retries: 30
        volumes:
            - db-data:/var/lib/mysql
        networks:
            - back

    api:
        build: ./apps/api
        image: ec-api:dev
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        ports:
            - "8000:8000"
            - "127.0.0.1:5678:5678"   # debugpy（Zed からアタッチ）。自分の Mac からだけ繋がる
        env_file:
            - ./apps/api/.env
        environment:
            # DEBUGPY=1 docker compose up api で起動したときだけデバッガを有効にする
            DEBUGPY: ${DEBUGPY:-0}
        volumes:
            - ./apps/api/src:/app/src
            - media:/app/media
        networks:
            - front
            - back

    worker:
        build: ./apps/api
        image: ec-api:dev
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        env_file:
            - ./apps/api/.env
        volumes:
            - ./apps/api/src:/app/src
            - media:/app/media
        networks:
            - back
        stop_grace_period: 30s
        command: [".venv/bin/celery", "--workdir", "src", "-A", "config", "worker", "--loglevel", "info"]

    redis:
        image: redis:8-alpine
        ports:
            - "127.0.0.1:6379:6379"   # GUI ツール（Redis Insight など）用。自分の Mac からだけ繋がる
        networks:
            - back

    web:
        build: ./apps/web
        ports:
            - "5173:5173"
        depends_on:
            - api
        networks:
            - front
        develop:
            watch:
                # 1項目を1行で書く（{ } の書き方）。保存時の整形で字下げが崩れないようにするため
                - { action: sync, path: ./apps/web/src, target: /app/src }
                - { action: rebuild, path: ./apps/web/package.json }

volumes:
    db-data:
    media:

networks:
    front:
    back:
