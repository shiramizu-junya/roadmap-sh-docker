services:
    db:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: root-pass
            MYSQL_DATABASE: ec
            MYSQL_USER: ec
            MYSQL_PASSWORD: ec-pass
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
            interval: 2s
            timeout: 5s
            retries: 30
        volumes:
            - db-data:/var/lib/mysql
        networks:
            - back

    api:
        build: ./apps/api
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "8000:8000"
        environment:
            DB_HOST: db
            DB_NAME: ec
            DB_USER: ec
            DB_PASSWORD: ec-pass
        volumes:
            - ./apps/api/src:/app/src
        networks:
            - front
            - back

    web:
        build: ./apps/web
        ports:
            - "5173:5173"
        depends_on:
            - api
        networks:
            - front
        develop:
            watch:
                - action: sync
                  path: ./apps/web/src
                  target: /app/src
                - action: rebuild
                  path: ./apps/web/package.json

volumes:
    db-data:

networks:
    front:
    back:
